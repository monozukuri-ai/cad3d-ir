[project]
name = "cad3d-ir-parasolid"
version = "0.3.2"
description = "Parasolid transmit-file (X_T / X_B) importer for cad3d-ir through parasolid-kit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" },
]
keywords = [
    "3d-cad",
    "brep",
    "gltf",
    "parasolid",
    "step",
    "x_t",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "cad3d-ir>=0.3,<0.4",
    # 0.4.3 holds the shared glTF helpers (cad3d_ir_step.shapes)
    "cad3d-ir-step>=0.4.3,<0.5",
    # 0.3.11: partial conversion, attributes (colours and names), spun surfaces,
    # instance placement, the schema families of other Parasolid builds and the
    # standard keys of Parasolid 9 to 16. 0.3.12: partial conversion returns a
    # shape BRepCheck rejects with a warning instead of failing.
    "parasolid-kit[occt]>=0.3.12,<0.4",
]

[project.urls]
Homepage = "https://github.com/monozukuri-ai/cad3d-ir"
Repository = "https://github.com/monozukuri-ai/cad3d-ir/tree/main/packages/cad3d-ir-parasolid"
Issues = "https://github.com/monozukuri-ai/cad3d-ir/issues"

[project.scripts]
cad3d-ir-parasolid = "cad3d_ir_parasolid.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.uv.sources]
cad3d-ir = { workspace = true }
cad3d-ir-step = { workspace = true }

[tool.uv.build-backend]
source-include = [
    "tests/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
